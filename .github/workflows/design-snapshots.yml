name: Design snapshots

# Renders the design system and sample panels to PNGs and commits them to
# replica/design/snapshots on the same branch, so the look can be reviewed
# without a Mac. Runs only for commits whose message contains [snapshots].
on:
  push:

concurrency:
  group: snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: contains(github.event.head_commit.message, '[snapshots]')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project MacbookNotch.xcodeproj \
            -scheme MacbookNotch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Render snapshots
        run: |
          rm -rf replica/design/snapshots
          build/Build/Products/Debug/MacbookNotch.app/Contents/MacOS/MacbookNotch \
            --design-snapshots "$PWD/replica/design/snapshots"
          ls -la replica/design/snapshots

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add replica/design/snapshots
          if git diff --cached --quiet; then
            echo "Snapshots unchanged."
            exit 0
          fi
          git commit -m "design: update rendered snapshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
