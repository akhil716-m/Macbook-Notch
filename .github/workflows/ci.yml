name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode on the runner. Xcode 26+ includes Apple's
      # FoundationModels framework, which the Ask tool needs; older ones
      # build the app without it.
      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          swift --version

      - name: Test NotchCore
        run: swift test --package-path Packages/NotchCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (universal, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project MacbookNotch.xcodeproj \
            -scheme MacbookNotch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      # Catch launch-blocking signing problems here rather than on someone's Mac.
      - name: Check the app's signature
        run: |
          codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/MacbookNotch.app
          codesign -d --entitlements - build/Build/Products/Release/MacbookNotch.app

      # With the hardened runtime on, macOS only loads frameworks signed by
      # the app's own team. GitHub's runners don't enforce this (SIP is off),
      # so the launch check below can't catch it; a real Mac kills the app.
      - name: Check embedded frameworks can load
        run: |
          app=build/Build/Products/Release/MacbookNotch.app
          team() { codesign -dv "$1" 2>&1 | sed -n 's/^TeamIdentifier=//p'; }
          app_team=$(team "$app")
          hardened=no
          codesign -dv "$app" 2>&1 | grep -q 'flags=.*runtime' && hardened=yes
          echo "App: team '$app_team', hardened runtime: $hardened"
          status=0
          for fw in "$app"/Contents/Frameworks/*.framework; do
            [ -e "$fw" ] || continue
            echo "$(basename "$fw"): team '$(team "$fw")'"
            # Ad-hoc signatures have no team, so nothing can match one.
            if [ "$hardened" = yes ] && { [ "$app_team" = "not set" ] || [ "$(team "$fw")" != "$app_team" ]; }; then
              echo "::error::The hardened runtime will refuse to load $(basename "$fw"): it needs the app and framework signed by the same Developer ID team."
              status=1
            fi
          done
          exit $status

      # Start the app and make sure it's still running after 10 seconds.
      - name: Launch check
        run: |
          app=build/Build/Products/Release/MacbookNotch.app/Contents/MacOS/MacbookNotch
          "$app" > launch.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            echo "Still running after 10 s"
            kill "$pid"
          else
            wait "$pid"; code=$?
            echo "The app quit or crashed on launch (exit $code):"
            cat launch.log
            exit 1
          fi

      - name: Zip app
        run: ditto -c -k --keepParent build/Build/Products/Release/MacbookNotch.app MacbookNotch.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacbookNotch-${{ github.sha }}
          path: MacbookNotch.zip
          retention-days: 14
