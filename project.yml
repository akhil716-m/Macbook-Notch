# XcodeGen spec. Run `xcodegen generate` to create MacbookNotch.xcodeproj.
name: MacbookNotch
options:
  bundleIdPrefix: app.macbooknotch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  NotchCore:
    path: Packages/NotchCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MacbookNotch:
    type: application
    platform: macOS
    sources:
      - App/Sources
    dependencies:
      - package: NotchCore
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MacbookNotch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        # No Dock icon: the app lives in the notch and the menu bar.
        LSUIElement: true
        NSAppleEventsUsageDescription: MacbookNotch reads what's playing in Music and Spotify and controls playback from the notch.
        NSCalendarsFullAccessUsageDescription: MacbookNotch shows today's and tomorrow's events in the notch. Nothing leaves your Mac.
        NSCalendarsUsageDescription: MacbookNotch shows today's and tomorrow's events in the notch. Nothing leaves your Mac.
        NSRemindersFullAccessUsageDescription: MacbookNotch lists your reminders in the notch and lets you tick them off.
        NSRemindersUsageDescription: MacbookNotch lists your reminders in the notch and lets you tick them off.
        NSLocationWhenInUseUsageDescription: MacbookNotch uses your approximate location to show local weather.
        NSLocationUsageDescription: MacbookNotch uses your approximate location to show local weather.
        NSCameraUsageDescription: MacbookNotch shows your camera in the Mirror tool. Nothing is recorded or saved.
        NSHumanReadableCopyright: ""
        # Sparkle updates: fill both in to switch updates on. The key comes
        # from Sparkle's generate_keys tool; the feed is your appcast URL.
        SUFeedURL: ""
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: true
        # Lemon Squeezy licensing: fill in your store and product IDs to
        # switch licensing on. 0 means every build is unlocked.
        MNLicenseStoreID: 0
        MNLicenseProductID: 0
        MNPurchaseURL: ""
    entitlements:
      path: App/MacbookNotch.entitlements
      properties:
        # Needed under the hardened runtime to send Apple Events to Music and Spotify.
        com.apple.security.automation.apple-events: true
        # Needed under the hardened runtime for EventKit (Calendar and Reminders).
        com.apple.security.personal-information.calendars: true
        # Needed under the hardened runtime for "Use My Location" in Weather.
        com.apple.security.personal-information.location: true
        # Needed under the hardened runtime for the Mirror tool.
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.macbooknotch.MacbookNotch
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc "Sign to Run Locally" by default. Set your team in Xcode to sign properly.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    scheme: {}
