name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test NotchCore
        run: swift test --package-path Packages/NotchCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (universal, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project MacbookNotch.xcodeproj \
            -scheme MacbookNotch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build

      - name: Zip app
        run: ditto -c -k --keepParent build/Build/Products/Release/MacbookNotch.app MacbookNotch.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacbookNotch-${{ github.sha }}
          path: MacbookNotch.zip
          retention-days: 14
